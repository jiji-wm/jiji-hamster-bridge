[package]
name = "jiji-hamster-bridge"
version = "0.1.0"
description = "Pause/resume hamster time tracking from jiji activity and workspace focus"
authors = ["Petr Gajdůšek"]
license = "GPL-3.0-or-later"
repository = "https://github.com/jiji-wm/jiji-hamster-bridge"
edition = "2024"
publish = false

[[bin]]
name = "jiji-hamster-bridge"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
env_logger = "0.11"
futures-util = { version = "0.3", default-features = false }
log = "0.4"
notify = "8"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "process", "io-util", "time", "signal", "sync"] }
toml = "0.8"
zbus = { version = "5", default-features = false, features = ["tokio"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros", "time", "test-util", "sync"] }
